<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF批量加水印·©HB</title>
<style>
/* ============ 主题系统 ============
   四套主题由 <html data-theme="xxx"> 切换，右上角品牌图标即切换器。
   --mint / --rose / --taro / --cream / --soda 是五个「槽位色」，
   分别驱动：文件区 / 参数区 / 预览区 / 滑块(普通组) / 滑块(间距)。
   新增主题 = 复制一份 [data-theme] 块，改里面的色值即可，用法不用动。
=================================== */

/* ---- 主题三：马卡龙（默认，写在 :root 上） ----
   2026-09-24 重调：原先主色用「草莓红」，跟麦当劳的招牌红撞了。
   现在改成马卡龙真正的招牌六色系 —— 葡萄紫(主) / 开心果绿(辅) / 马卡龙蓝(点缀) /
   香草黄 + 西柚橙(滑块)，草莓粉只保留在渐变里当甜味点缀。
   注：--text/--muted/--faint 三档灰的字号递减，但对比度都必须过 WCAG AA(4.5:1)，
   因为这些颜色只作文字用。改色时务必跑 watermark_app/check_contrast.py 复核。 ---- */
:root {
  --bg:        #FBF7FC;   /* 香草奶油底（带一点紫调） */
  --card:      #FFFFFF;
  --border:    #EBDFF2;
  --border-2:  #D8C6E4;
  --text:      #4A372E;   /* 可可棕 */
  --muted:     #6B5546;
  --faint:     #74604E;
  --surface:   #FDFBFF;

  --mint:   #B8E6C8;  --mint-d:  #276B4B;   /* 开心果绿 = 辅助：文件区 */
  --rose:   #C9A7EE;  --rose-d:  #6B45B0;   /* 葡萄紫 = 主色：按钮 / 参数区 */
  --taro:   #A6D6F5;  --taro-d:  #1F6E93;   /* 马卡龙蓝 = 点缀：预览区 */
  --cream:  #FFE7A8;  --cream-d: #8A6A00;   /* 香草黄 = 滑块(普通组) */
  --soda:   #FFC6A8;  --soda-d:  #A5582A;   /* 西柚橙 = 滑块(间距) */

  --tint-mint: #E2F6EA;   /* 浅底：成功标签 */
  --tint-rose: #F2EAFF;   /* 浅底：待处理标签 / 徽章（淡紫） */
  --tint-taro: #E3F2FC;   /* 浅底：预览切换片选中（淡蓝） */
  --track:     #EDE3F2;   /* 滑块与进度条底槽 */
  --shadow:    rgba(140,110,180,.07);
  --glow:      rgba(130,95,175,.28);
  --drop-bg:   #F6F2FD;  --drop-bg-h: #EFE8FB;
  /* 一整条马卡龙：蓝 → 绿 → 黄 → 粉 → 紫 */
  --grad-slider: linear-gradient(90deg, #A6D6F5 0%, #B8E6C8 28%, #FFE7A8 52%, #FFC2D6 76%, #C9A7EE 100%);
  --grad-bar:    linear-gradient(90deg, #9ED2F2 0%, #A9DEC3 30%, #FFD98A 58%, #FFB9D0 80%, #C1A0E8 100%);
  /* 主色按钮的渐变（只有说一不二的主色按钮才用，白字必须始终 ≥4.5:1，别调浅） */
  --grad-btn:    linear-gradient(135deg, #8558D4, #6B45B0);

  /* 按钮立体阴影色：不支持 color-mix 时的回退（支持时自动按主色算） */
  --shade: #5B3B99;

  --radius: 14px; --radius-sm: 10px;
}

/* ---- 主题一：麦当劳（招牌红 + 金黄 + 薯条橙） ---- */
html[data-theme="mcd"] {
  --bg:#FFF8E7; --card:#FFFFFF; --border:#F7DCA1; --border-2:#EBC876;
  --text:#3F2617; --muted:#6E4E33; --faint:#7F5F40; --surface:#FFFDF4;
  --mint:#FFC72C;  --mint-d:#7E5600;
  --rose:#DA291C;  --rose-d:#96140E;
  --taro:#FF8A00;  --taro-d:#9E4E00;
  --cream:#FFE9A8; --cream-d:#7A5D18;
  --soda:#C05621;  --soda-d:#733110;
  --tint-mint:#FFF3CE; --tint-rose:#FCE0DC; --tint-taro:#FFE8CC;
  --track:#FBEBC0; --shadow:rgba(180,120,40,.09); --glow:rgba(190,110,30,.30);
  --drop-bg:#FFF7E2; --drop-bg-h:#FFEFCC;
  --grad-slider:linear-gradient(90deg,#FFC72C 0%,#FF8A00 46%,#DA291C 100%);
  --grad-bar:linear-gradient(90deg,#FFD86B 0%,#FF9E2C 46%,#E8453A 100%);
  --grad-btn:linear-gradient(135deg,#C41F13,#96140E);
  --shade:#7A120B;
}

/* ---- 主题三：奥利奥（饼干黑 + 奶油白 + 一点包装蓝） ----
   黑白主题：主色 = 饼干近黑（按钮/参数区），辅助 = 中灰（文件区），点缀 = 包装蓝。
   注意五个「槽位色」是给 8px 小圆点、边框、选中态用的，必须压在白卡上看得见，
   所以不能用接近白的浅灰，要选中灰。 ---- */
html[data-theme="oreo"] {
  --bg:#F3F3F6; --card:#FFFFFF; --border:#E4E4EA; --border-2:#C7C7D1;
  --text:#17171C; --muted:#4B4B55; --faint:#63636E; --surface:#FAFAFC;
  --rose:#2C2C34;  --rose-d:#14141A;   /* 饼干黑 = 主色：按钮 / 参数区 */
  --mint:#8E8E9C;  --mint-d:#3E3E48;   /* 夹心灰 = 辅助：文件区 */
  --taro:#8FA6C4;  --taro-d:#2F4568;   /* 包装蓝 = 点缀：预览区 */
  --cream:#C9C9D3; --cream-d:#585863;
  --soda:#A8B6CA;  --soda-d:#3A4C66;
  --tint-rose:#EFE1E1; --tint-mint:#E2E7F0; --tint-taro:#E3EAF6;
  --track:#E5E5EB; --shadow:rgba(20,20,30,.07); --glow:rgba(20,20,30,.24);
  --drop-bg:#F7F7FA; --drop-bg-h:#EDEDF3;
  --grad-slider:linear-gradient(90deg,#E2E2E8 0%,#A9A9B6 46%,#2C2C34 100%);
  --grad-bar:linear-gradient(90deg,#CFCFD8 0%,#8B8B99 46%,#2C2C34 100%);
  --grad-btn:linear-gradient(135deg,#33333C,#14141A);
  --shade:#0E0E13;
}

/* ---- 主题二：雪碧（柠檬绿 + 青柠黄 + 气泡青） ---- */
html[data-theme="sprite"] {
  --bg:#F1FBF3; --card:#FFFFFF; --border:#C6EBD1; --border-2:#9CD6AE;
  --text:#173D24; --muted:#3F6A4E; --faint:#52795F; --surface:#F8FEF9;
  --rose:#00853A;  --rose-d:#005E28;   /* 品牌绿 = 主色：按钮 / 参数区 */
  --mint:#B8DC1E;  --mint-d:#5A7300;   /* 青柠黄 = 辅助：文件区 */
  --taro:#6FD3C7;  --taro-d:#1B7A6E;
  --cream:#EFFF9E; --cream-d:#6A7A1E;
  --soda:#BFE9F5;  --soda-d:#357389;
  --tint-rose:#DCF5E4; --tint-mint:#F2FAD3; --tint-taro:#DCF5F1;
  --track:#DCF2E3; --shadow:rgba(30,100,60,.08); --glow:rgba(30,110,60,.28);
  --drop-bg:#E8F8EC; --drop-bg-h:#D7F2DE;
  --grad-slider:linear-gradient(90deg,#009A44 0%,#C7E012 46%,#6FD3C7 100%);
  --grad-bar:linear-gradient(90deg,#37B24D 0%,#C7E012 46%,#6FD3C7 100%);
  --grad-btn:linear-gradient(135deg,#0A7D3C,#005E28);
  --shade:#004B20;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.6;
  padding: 16px; height: 100vh; display: flex; flex-direction: column; gap: 12px;
}

header { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
header h1 { font-size: 16px; font-weight: 600; }
/* 署名：手写体（Segoe Script 是 Windows 自带的英文书写体，逐个回退保证一定有得用） */
header .sign {
  font-family: "Segoe Script", "Bradley Hand ITC", "Ink Free", "Segoe Print", cursive;
  font-style: italic; font-size: 15px; font-weight: 400;
  color: var(--muted); letter-spacing: .2px; transform: rotate(-1.5deg);
}
/* 新版本提示：发现新版时出现在署名旁，闪烁、可点击去下载页（不想更新无视即可） */
.upd {
  display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .3px;
  padding: 2px 9px; border-radius: 999px; text-decoration: none; cursor: pointer;
  color: #fff; background: var(--rose, #E8615A);
  animation: updBlink 1.1s ease-in-out infinite;
}
.upd:hover { filter: brightness(1.06); }
@keyframes updBlink { 0%, 100% { opacity: 1; } 50% { opacity: .42; } }

/* ---------- 主题切换器（右上角） ---------- */
.themes { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.dot {
  width: 30px; height: 30px; padding: 0; cursor: pointer;
  display: grid; place-items: center;
  border-radius: 10px; border: 1px solid var(--border-2);
  background: var(--ib, var(--card));
  box-shadow: 0 1px 3px var(--shadow);
  transition: transform .18s, box-shadow .18s, border-color .18s, background .18s;
}
.dot svg { width: 19px; height: 19px; display: block; transition: transform .18s; }
.dot:hover { transform: translateY(-2px); box-shadow: 0 3px 8px var(--shadow); }
.dot.on {
  border-color: transparent;
  box-shadow: 0 0 0 2px var(--rose), 0 3px 8px var(--shadow);
}
.dot.on svg { transform: scale(1.08); }

/* 三栏：选文件(固定窄) / 水印参数(固定中) / 实时预览(吃掉剩余宽度，最大化观察区) */
main { flex: 1; display: grid; grid-template-columns: 296px 356px minmax(420px, 1fr); gap: 12px; min-height: 0; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0;
  box-shadow: 0 2px 10px var(--shadow);
}
.card h2 { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.card h2::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sc, var(--rose));
}
.card h2 em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 400; }
.scroll { overflow-y: auto; flex: 1; min-height: 0; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

/* 选择入口：两个明确按钮，取代原来一片虚线区（点哪儿不确定）
   配色用 --rose-d —— 也就是每套主题的「主色」（马卡龙草莓红 / 麦当劳招牌红 /
   雪碧品牌绿 / 奥利奥饼干黑），跟底部「开始处理」同一支，整屏只有一个强调色。 */
.pickbar { display: flex; gap: 6px; }
.pickbar .btn { flex: 1; padding: 9px 6px; font-size: 13px; --bc: var(--rose-d); }
.pickhint { font-size: 12px; color: var(--muted); text-align: center; margin-top: -2px; }
/* 拖拽文件进入窗口时，把第 1 张卡整个点亮当落点提示 */
#pickCard { transition: box-shadow .15s, background .15s; }
body.dragging #pickCard {
  background: var(--tint-rose);
  box-shadow: inset 0 0 0 2px var(--rose), 0 2px 12px var(--shadow);
}

.filelist { display: flex; flex-direction: column; gap: 6px; }
/* 空列表时把提示垂直居中，不然一大块留白会显秃 */
.filelist.blank { justify-content: center; }
.file {
  display: flex; align-items: center; gap: 6px; padding: 8px 9px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
  transition: background .15s, border-color .15s;
}
.file:hover { border-color: var(--border-2); }
.file.sel { background: var(--tint-mint); border-color: var(--mint-d); }
.file .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.file .pg { font-size: 12px; color: var(--muted); }
.file .del {
  flex: none; border: 0; background: none; cursor: pointer; font-family: inherit;
  color: var(--faint); font-size: 15px; line-height: 1; padding: 1px 3px; border-radius: 6px;
  transition: background .15s, color .15s;
}
.file .del:hover { background: var(--tint-rose); color: var(--rose-d); }
/* 复选框：原生 input 自定义外观，勾选色跟随主题 */
.file .ck {
  flex: none; appearance: none; -webkit-appearance: none;
  width: 15px; height: 15px; border: 1.5px solid var(--border-2); border-radius: 4px;
  background: var(--card); cursor: pointer; display: grid; place-items: center;
  transition: background .15s, border-color .15s;
}
.file .ck:hover { border-color: var(--mint-d); }
/* 勾选态用深色实底 + 白勾：原来用浅色槽位色作底，白勾在浅底上几乎看不见 */
.file .ck:checked { background: var(--mint-d); border-color: var(--mint-d); }
.file .ck:checked::after {
  content: ""; width: 4px; height: 8px; margin-top: -2px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.empty { text-align: center; color: var(--faint); font-size: 12px; padding: 22px 8px; line-height: 1.9; }

/* 文件操作条 */
.filetools { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.mini {
  border: 1px solid var(--border-2); background: var(--card); color: var(--muted);
  border-radius: 8px; padding: 3px 9px; font-family: inherit; font-size: 12px;
  cursor: pointer; transition: background .15s, color .15s, border-color .15s;
}
.mini:hover:not(:disabled) { background: var(--tint-mint); color: var(--mint-d); border-color: var(--mint-d); }
.mini.danger { color: var(--rose-d); border-color: #E8B7BC; }
.mini.danger:hover:not(:disabled) { background: var(--tint-rose); color: var(--rose-d); border-color: var(--rose-d); }
.mini:disabled { opacity: .45; cursor: not-allowed; }

.tag { font-size: 12px; padding: 1px 7px; border-radius: 8px; background: var(--tint-rose); color: var(--rose-d); }
.tag.ok { background: var(--tint-mint); color: var(--mint-d); }

.seg { display: flex; border: 1px solid var(--border-2); border-radius: var(--radius-sm); overflow: hidden; }
.seg button {
  flex: 1; padding: 8px 0; border: 0; background: var(--card); color: var(--muted);
  font-family: inherit; font-size: 12px; cursor: pointer; transition: all .2s;
}
/* 选中态用实色深底 + 白字（原来的浅色渐变底配同色系深字，对比不足看着发虚） */
.seg button.on { background: var(--rose-d); color: #fff; font-weight: 600; }

.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
input[type=text], select {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 13px; background: var(--surface); color: var(--text);
}
input[type=text]:focus, select:focus { outline: 0; border-color: var(--rose); background: #fff; }
.note { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

.presetbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.presetbar select { flex: 1; min-width: 120px; }
.saverow { display: flex; gap: 4px; flex-wrap: wrap; }
/* 斜切按钮比常规按钮占地宽，窄栏里收紧一点 */
.presetbar .btn, .saverow .btn { padding: 6px 12px; letter-spacing: 0; }

/* ---------- 图标按钮：预设的「保存 / 删除」 ----------
   描边款（默认跟卡片一个底色），hover 才上主题色；禁用时整体变淡。
   尺寸跟着下拉框走（select 高 ~36px），两个并排在下拉框右侧。 */
.iconbtn {
  flex: none; width: 36px; height: 36px; padding: 0;
  display: grid; place-items: center; cursor: pointer;
  border: 1px solid var(--border-2); border-radius: 10px;
  background: var(--card); color: var(--muted);
  transition: background .15s, color .15s, border-color .15s, box-shadow .15s;
}
.iconbtn svg { width: 17px; height: 17px; display: block; }
.iconbtn:hover:not(:disabled) {
  background: var(--tint-rose); color: var(--rose-d); border-color: var(--rose-d);
}
/* 保存时按钮保持高亮，提示「命名行是由它打开的」 */
.iconbtn.on {
  background: var(--rose-d); color: #fff; border-color: var(--rose-d);
  box-shadow: 0 0 0 2px var(--tint-rose);
}
.iconbtn:disabled { opacity: .4; cursor: not-allowed; }
.iconbtn.danger:hover:not(:disabled) { background: var(--tint-rose); color: var(--rose-d); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.sl { display: flex; flex-direction: column; gap: 3px; }
.sl .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.sl .top b { color: var(--tick-d, var(--text)); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- 滑块（参考 uiverse bright-swan，配色改马卡龙） ---------- */
.slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 10px; border-radius: 5px; outline: none;
  background-color: var(--track);
  background-image: var(--grad-slider);
  opacity: .8; -webkit-transition: .2s; transition: opacity .2s;
}
.slider:hover { opacity: 1; }
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
  background-color: #fff;
  background-image: linear-gradient(160deg, #FFFFFF 0%, var(--tick, #A8DFC1) 100%);
  border: 1.5px solid #fff;
  box-shadow: 0 2px 6px var(--glow);
}
.slider::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
  background-image: linear-gradient(160deg, #FFFFFF 0%, var(--tick, #A8DFC1) 100%);
  border: 1.5px solid #fff;
  box-shadow: 0 2px 6px var(--glow);
}

.group { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; background: var(--surface); }
.group > .gt { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

.chips { display: flex; gap: 6px; }
.chip {
  flex: none; text-align: center; padding: 5px 14px; border: 1px solid var(--border-2);
  border-radius: var(--radius-sm); background: var(--card); font-size: 12px; color: var(--muted); cursor: pointer;
  transition: all .2s;
}
.chip:hover { border-color: var(--taro-d); color: var(--taro-d); }
.chip.on { border-color: var(--taro-d); background: var(--tint-taro); color: var(--taro-d); font-weight: 600; }

#cv, #pv { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); display: block; }
#pv { display: none; }
/* 预览容器吃掉卡片剩余高度 —— 窗口越大看得越大 */
.pvbox { display: none; overflow: auto; flex: 1; min-height: 160px; border-radius: var(--radius-sm); }
.pvbar { display: flex; align-items: center; gap: 6px; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

footer { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar i {
  display: block; height: 100%; width: 0; transition: width .2s;
  background-image: var(--grad-bar);
}
.log { font-size: 12px; color: var(--muted); min-width: 240px; }

/* ---------- 按钮（参考 uiverse blue-bobcat：厚底 3D + 斜切，马卡龙配色） ---------- */
.btn {
  /* 主色 / 深阴影色 / 光晕色：换 --bc 即可整体换色 */
  --bc: var(--rose-d);
  --bc-d: var(--shade, #A0505A);
  --unsk: 10deg;          /* 文字反向斜切量：0deg = 文字跟着一起歪（原版效果） */
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 7px 16px; margin: 0 3px;
  font-family: inherit; font-size: 12px; font-weight: 800; letter-spacing: 1px;
  color: #fff; white-space: nowrap; cursor: pointer; user-select: none;
  background: var(--bc);
  border: 2px solid var(--bc-d);
  border-radius: 10px;
  box-shadow: 0 4px 0 var(--bc-d);
  transform: skew(-10deg);
  filter: drop-shadow(0 6px 10px var(--glow));
  transition: transform .1s ease, box-shadow .1s ease, letter-spacing .1s ease;
}
@supports (color: color-mix(in srgb, red, blue)) {
  .btn {
    --bc-d: color-mix(in srgb, var(--bc) 70%, #3A241C);
    filter: drop-shadow(0 8px 14px color-mix(in srgb, var(--bc) 45%, transparent));
  }
}
/* 关键：中文方块字跟着 -10deg 斜切会明显发飘，这里把文字反向掰正 */
.btn > span { display: inline-block; transform: skew(var(--unsk)); }
.btn:hover { filter: drop-shadow(0 4px 8px var(--glow)) brightness(1.04); }
.btn:active {
  transform: skew(-10deg) translateY(4px);
  box-shadow: 0 0 0 var(--bc-d);
  letter-spacing: 0px;
}
/* 描边款：底色跟卡片走（原来写死奶白，换主题时会跟主题底不融），文字与描边用 --bc */
.btn.ghost {
  background: var(--card); color: var(--bc);
  border: 2px solid var(--bc);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--bc) 38%, var(--card));
}
.btn.ghost:active { box-shadow: 0 0 0 color-mix(in srgb, var(--bc) 38%, var(--card)); }

/* 主色实底按钮（「PDF文件」/「开始处理」）叠一层主题渐变，呼应马卡龙的糖色层次。
   注意排除 .ghost（描边款必须是纯卡片底），所以用 :not(.ghost)。 */
.pickbar .btn:not(.ghost), .btn.go { background-image: var(--grad-btn); }

/* 主按钮：完整还原原版尺寸（184x48） */
.btn.go {
  width: 184px; height: 48px; padding: 0; margin: 0;
  font-size: 17px; font-weight: 800; letter-spacing: 2px;
  border-radius: 12px; box-shadow: 0 8px 0 var(--bc-d);
  --bc: var(--rose-d);
}
.btn.go:active { transform: skew(-10deg) translateY(8px); box-shadow: 0 0 0 var(--bc-d); }
.btn:disabled { opacity: .42; pointer-events: none; filter: grayscale(.35); }
</style>

          <button class="iconbtn" id="btnSave" title="把当前参数存为我的预设" aria-label="存为预设">

            <div class="top"><span>灰度</span><b id="vGr">191</b></div>

    </div>
    <div class="pvbox scroll" id="pvbox"><img id="pv" alt="真实页面预览"></div>
    <canvas id="cv" width="960" height="540"></canvas>

      <button class="mini" id="pvPrev">上一页</button>
      <span class="count" id="pvPage">1 / 1</span>

</main>

<footer>
  <div class="bar"><i id="barFill"></i></div>
  <div class="log" id="log">就绪 · 请先选择 PDF 文件</div>
  <button class="btn go" id="go"><span>开始处理</span></button>
</footer>

<script>
const $ = id => document.getElementById(id);

/* ---------- 版本与更新检查（GitHub Releases，Windows / Mac 共用同一套） ---------- */
const APP_VER = "1.0";                      // 当前版本号（两段式 主.次）。改版本时：同步改 build_version.py 的 @VER@，并打 tag vX.X
const UPDATE_REPO = "HongBing5/PDF-watermark";   // ← 你的 GitHub「用户名/仓库名」，更新提示才会生效
function parseVer(v){ return (v || "").replace(/^v/, "").split(".").map(n => parseInt(n, 10) || 0); }
function openExternal(url){
  // 桌面 exe / app：用系统默认浏览器打开（最稳）；原型模式退回 window.open
  if(typeof pywebview !== "undefined" && pywebview.api && pywebview.api.open_url) pywebview.api.open_url(url);
  else window.open(url, "_blank");
}
function checkUpdate(){
  if(!UPDATE_REPO || UPDATE_REPO.indexOf("/") < 0) return;
  const url = "https://api.github.com/repos/" + UPDATE_REPO + "/releases/latest";
  fetch(url, { headers: { "Accept": "application/vnd.github+json" } })
    .then(r => { if(!r.ok) throw 0; return r.json(); })
    .then(j => {
      const latest = j.tag_name || "";
      const cur = parseVer(APP_VER), nw = parseVer(latest);
      const len = Math.max(cur.length, nw.length);
      for(let i = 0; i < len; i++){
        const c = cur[i] || 0, n = nw[i] || 0;
        if(n > c){                         // 有新版本 → 闪烁提示，点击去下载页
          const b = $("updateBadge");
          b.textContent = "● 新版本 " + latest.replace(/^v/, "");
          b.href = j.html_url || ("https://github.com/" + UPDATE_REPO + "/releases");
          b.onclick = e => { e.preventDefault(); openExternal(b.href); };
          b.hidden = false;
          return;
        }
        if(n < c) return;                  // 本地比线上还新 → 不提示
      }
    })
    .catch(() => {});                      // 没网络 / 还没发版 / 触发限流 → 静默，不影响使用
}

/* ---------- 文件列表 ----------
   默认必须是空的 —— 打开就有假文件会让用户以为真的选中了东西。
   真实数据由 Python 调 window.setFiles([{nm,pg,done,path},...]) 注入。
-------------------------------- */
let FILES = [];

function renderFiles(){
  const box = $("fileList");
  box.innerHTML = "";
  box.classList.toggle("blank", !FILES.length);
  if(!FILES.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = "还没有选择文件"
      + "<br><span style='font-size:11px;opacity:.85'>点上面的按钮，或把 PDF / 文件夹拖进窗口</span>";
    box.appendChild(e);
  }
  FILES.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "file" + (f.sel ? " sel" : "");

    const ck = document.createElement("input");
    ck.type = "checkbox"; ck.className = "ck"; ck.checked = f.sel;
    ck.onchange = () => { f.sel = ck.checked; row.classList.toggle("sel", f.sel); updateFiles(); };

    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = f.nm; nm.title = f.nm;
    nm.onclick = () => { f.sel = !f.sel; renderFiles(); };   // 点文件名也可勾选

    const pg = document.createElement("span");
    pg.className = "pg"; pg.textContent = f.pg + "页";

    const tag = document.createElement("span");
    tag.className = "tag" + (f.done ? " ok" : "");
    tag.textContent = f.done ? "已处理" : "待处理";

    const del = document.createElement("button");
    del.className = "del"; del.title = "从列表移除（不删除原文件）"; del.textContent = "×";
    del.onclick = () => { FILES.splice(i, 1); renderFiles(); log("已移除：" + f.nm); };

    row.append(ck, nm, pg, tag, del);
    box.appendChild(row);
  });
  updateFiles();
}

function updateFiles(){
  const n = FILES.filter(f => f.sel).length;
  const todo = FILES.filter(f => !f.done).length;
  $("fCount").textContent = FILES.length ? `共 ${FILES.length} 个 · 已选 ${n}` : "共 0 个";
  $("btnSelAll").textContent = (FILES.length && n === FILES.length) ? "取消全选" : "全选";
  ["btnSelAll","btnSelInv","btnDelSel","btnClr"].forEach(b => $(b).disabled = !FILES.length);
  $("btnDelSel").disabled = n === 0;
  $("go").disabled = !FILES.length;
  log(FILES.length ? `共 ${FILES.length} 个文件，${todo} 个待处理` : "就绪 · 请先选择 PDF 文件");

  /* 预览对象跟随列表里第一个有真实路径的文件 */
  const first = FILES.find(f => f.path) || null;
  if(first && first.path !== PV.path){
    PV = { path:first.path, name:first.nm, page:0, pages:first.pg || 1, fit:PV.fit };
    schedulePreview();
  }else if(!first && PV.path){
    PV.path = ""; PV.name = "";
  }
  syncPreviewMode();
}
/* Python 可调用：整体替换文件列表 */
window.setFiles = list => {
  FILES = (list || []).map(f => ({ sel:false, done:!!f.done, nm:f.nm, pg:f.pg, path:f.path }));
  renderFiles();
};
/* Python 可调用：追加（拖拽落文件后由后端回推）—— 复用上面同一套去重逻辑。
   注意这里必须写 `= addFiles` 而不是 `= list => addFiles(list)`：
   顶层 function 声明本身就已经挂在 window 上，箭头函数里的 addFiles 解析到的
   就是 window.addFiles 自己，会无限递归（实测 RangeError: Maximum call stack）。 */
window.addFiles = addFiles;
/* Python 可调用：拖进来的东西里没有可处理的 PDF */
window.dropRejected = n => log(n
  ? "拖入的内容里没有可处理的 PDF（支持 PDF 文件，或含 PDF 的文件夹）"
  : "没有识别到文件");

$("btnSelAll").onclick = () => {
  const all = FILES.length && FILES.every(f => f.sel);
  FILES.forEach(f => f.sel = !all);
  renderFiles();
};
$("btnSelInv").onclick = () => { FILES.forEach(f => f.sel = !f.sel); renderFiles(); };
$("btnDelSel").onclick = () => {
  const n = FILES.filter(f => f.sel).length;
  if(!n) return;
  FILES = FILES.filter(f => !f.sel);
  renderFiles();
  log(`已移除 ${n} 个文件，剩余 ${FILES.length} 个（原文件未动）`);
};
$("btnClr").onclick = () => {
  if(!FILES.length) return;
  const n = FILES.length; FILES = [];
  renderFiles(); log(`已清空 ${n} 个文件（原文件未动）`);
};
/* ---------- 与 Python 后端的桥接 ----------
   纯浏览器打开 ui.html 时 pywebview 不存在 → 自动退回 canvas 模拟预览，原型照样能演示。
------------------------------------------------ */
/* 注意：pywebview 是在页面加载完成后才注入 window.pywebview 的（并派发 pywebviewready 事件），
   所以这里绝不能直接判断一次就定下来 —— 那样在打包后的 exe 里会永远识别不到后端、
   界面一直停在 canvas 模拟模式。改成 HAS_API 可变更 + bindBackend() 事件/轮询双保险。 */
let HAS_API = false;
let BACKEND_BOUND = false;
function bindBackend(){
  if(BACKEND_BOUND) return true;
  if(typeof pywebview === "undefined" || !pywebview || !pywebview.api) return false;
  BACKEND_BOUND = HAS_API = true;
  pywebview.api.load_presets().then(arr => {          // 载入 exe 同级 presets.json
    if(arr && arr.length){ custom = arr.slice(); refreshSelect("b0"); }
  });
  syncPreviewMode();
  if(PV.path) schedulePreview();
  log("已连接本地后端 · 选好文件即可开始处理");
  return true;
}
window.addEventListener("pywebviewready", bindBackend);
(function waitBackend(){
  let n = 0;
  const t = setInterval(() => { if(bindBackend() || ++n > 40) clearInterval(t); }, 250);
})();

let PV = { path:"", name:"", page:0, pages:1, fit:true };

function params(){
  return {
    text:S.text, font_size:S.fs, rotate:S.rot, alpha:S.al, grey:S.gr,
    gap_x:S.gx, gap_y:S.gy, suffix:S.sfx, emboss:S.emboss,
    light_color:255, light_alpha:S.la, dark_color:S.dc, dark_alpha:S.da, stroke_div:S.sd,
  };
}

/* 底部一行说明：直接把「第1课.pdf 会变成什么」写出来，比参数名直观 */
function updateOutHint(){
  $("outHint").textContent = `成品：第1课${S.sfx}.pdf（与源文件同目录）`;
}

/* 预览模式：接了后端且有文件 → 真实页面渲染；否则 canvas 模拟 */
function syncPreviewMode(){
  const real = HAS_API && !!PV.path;
  $("chips").style.display  = real ? "none" : "flex";
  $("pvbox").style.display  = real ? "block" : "none";
  $("cv").style.display     = real ? "none"  : "block";
  $("pvBar").style.display  = real ? "flex"  : "none";
  $("pvName").textContent   = real ? PV.name : (HAS_API ? "示意预览" : "模拟页面");
}

let pvTimer = null;
function schedulePreview(){ if(HAS_API){ clearTimeout(pvTimer); pvTimer = setTimeout(realPreview, 260); } }
function realPreview(){
  if(!HAS_API) return;
  const key = PV.path;
  if(!key) return;
  pywebview.api.preview(params(), PV.path, PV.page).then(src => {
    if(!src) return;
    $("pv").src = src;
    $("pv").style.display = "block";
    $("pvPage").textContent = `${PV.page + 1} / ${PV.pages}`;
  });
}

$("btnPickPdf").onclick = () => {
  if(!HAS_API){ log("原型模式：未连接后端，无法真正选择文件"); return; }
  pywebview.api.pick_pdfs(S.sfx).then(list => { if(list && list.length) addFiles(list); });
};
$("btnPickDir").onclick = () => {
  if(!HAS_API){ log("原型模式：未连接后端，无法真正选择文件夹"); return; }
  pywebview.api.pick_dir(S.sfx).then(list => { if(list && list.length) addFiles(list); });
};
/* 追加文件（已存在的按路径去重） */
function addFiles(list){
  const have = new Set(FILES.map(f => f.path).filter(Boolean));
  const add = list.filter(f => !have.has(f.path));
  if(!add.length){ log("这些文件已经在列表里了"); return; }
  add.forEach(f => f.sel = false);
  FILES = FILES.concat(add);
  renderFiles();
  log(`已添加 ${add.length} 个文件，共 ${FILES.length} 个`);
}
/* ---------- 拖拽添加 ----------
   浏览器安全限制：JS 拿不到被拖入文件的真实路径（File 对象只有文件名）。
   所以真正的路径由 Python 侧取：pywebview 会为 drop 事件附带 pywebviewFullPath
   （见 app_main.py 里注册的 DOM 事件处理器）。这里只负责：
     1) 阻止 WebView 默认行为（不然会把 PDF 当网页打开）
     2) 给出「可以松手了」的视觉反馈
------------------------------------------------ */
(function(){
  let depth = 0;                                  // 进出子元素会反复触发，用计数消抖
  const hasFiles = e => !!(e.dataTransfer && Array.prototype.indexOf.call(
        e.dataTransfer.types || [], "Files") >= 0);
  const paint = v => document.body.classList.toggle("dragging", v);

  document.addEventListener("dragenter", e => {
    if(!hasFiles(e)) return;
    e.preventDefault(); depth++; paint(true);
  });
  document.addEventListener("dragover", e => {
    if(!hasFiles(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "copy";
  });
  document.addEventListener("dragleave", e => {
    if(!hasFiles(e)) return;
    if(--depth <= 0){ depth = 0; paint(false); }
  });
  document.addEventListener("drop", e => {
    e.preventDefault(); depth = 0; paint(false);
    if(!HAS_API) log("原型模式：未连接后端，拖拽无法读取文件");
  });
})();

$("pvPrev").onclick = () => { if(PV.page > 0){ PV.page--; realPreview(); } };
$("pvNext").onclick = () => { if(PV.page < PV.pages - 1){ PV.page++; realPreview(); } };
$("pv1to1").onclick = () => {
  PV.fit = !PV.fit;
  $("pv").style.width    = PV.fit ? "100%" : "auto";
  $("pv").style.maxWidth = PV.fit ? "100%" : "none";
  $("pv1to1").textContent = PV.fit ? "1:1 原尺寸" : "贴合宽度";
};

/* ---------- 内置预设（沿用已交付 60+ 课件的实测参数） ---------- */
const DEFAULTS = [
  { name:"课件通用 · 浮雕双色",   emboss:true,  text:"©向上少年|侵权必究", fs:18, rot:30, gx:130, gy:95,  la:0.20, da:0.12, sd:22, dc:25, al:0.10, gr:191, sfx:"_带水印" },
  { name:"大页面 1440×810 · 浮雕", emboss:true,  text:"©向上少年|侵权必究", fs:18, rot:30, gx:180, gy:130, la:0.20, da:0.12, sd:22, dc:25, al:0.10, gr:191, sfx:"_带水印" },
  { name:"深米色背景 · 普通浅灰",  emboss:false, text:"©向上少年|侵权必究", fs:18, rot:30, gx:130, gy:95,  la:0.20, da:0.12, sd:22, dc:25, al:0.10, gr:191, sfx:"_带水印" },
  { name:"浅米色古风 · 普通深灰",  emboss:false, text:"©向上少年|侵权必究", fs:18, rot:30, gx:180, gy:130, la:0.20, da:0.12, sd:22, dc:25, al:0.18, gr:150, sfx:"_带水印" },
];

const S = Object.assign({}, DEFAULTS[0]);
S.bg = "light";
const SLIDERS = ["fs","rot","gx","gy","la","da","sd","dc","al","gr"];
const DEC = ["la","da","al"];
const KEY = "wm_presets_v1";
/* 预览用的模拟背景：浅色页 / 中性色 / 深色页（照片页已按用户要求去掉） */
const BG = { light:["#EDE8DE","#3A3730"], mid:["#8FA38C","#FFFFFF"], dark:["#7A2E2E","#F6EDE1"] };

function loadCustom(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function persist(){ localStorage.setItem(KEY, JSON.stringify(custom)); }
let custom = loadCustom();

function findPreset(v){
  if(!v || v === "custom") return null;
  return v[0] === "b" ? DEFAULTS[+v.slice(1)] : custom[+v.slice(1)];
}
function refreshSelect(sel){
  const s = $("presetSel"); s.innerHTML = "";
  const add = (label, arr, prefix) => {
    const og = document.createElement("optgroup"); og.label = label;
    arr.forEach((p, i) => {
      const o = document.createElement("option");
      o.value = prefix + i; o.textContent = p.name; og.appendChild(o);
    });
    s.appendChild(og);
  };
  add("内置预设", DEFAULTS, "b");
  if(custom.length) add("我的预设", custom, "c");
  const oc = document.createElement("option");
  oc.value = "custom"; oc.textContent = "自定义（当前参数）";
  s.appendChild(oc);
  s.value = sel || "custom";
  updatePresetBtns();
}

/* 内置预设是校准过的基准参数（对应已交付 60+ 课件），只读；
   只有「我的预设」里的条目才允许删除。按钮直接置灰，而不是点了才报错。 */
function updatePresetBtns(){
  const v = $("presetSel").value;
  const del = $("btnDel");
  const mine = v && v[0] === "c";
  del.disabled = !mine;
  del.title = mine ? "删除这个我保存的预设" : "内置预设不可删除";
}

function syncUI(){
  SLIDERS.forEach(k => {
    $(k).value = S[k];
    $("v" + k[0].toUpperCase() + k.slice(1)).textContent =
      DEC.includes(k) ? (+S[k]).toFixed(2) : S[k];
  });
  $("text").value = S.text; $("sfx").value = S.sfx;
  updateOutHint();
  setMode(S.emboss);
}
/* 预设只管水印参数，输出命名是独立的输出设置，不随预设切换 */
function applyPreset(p){ Object.assign(S, p); syncUI(); draw(); schedulePreview(); }

function setMode(emboss){
  S.emboss = emboss;
  $("mEmboss").classList.toggle("on", emboss);
  $("mPlain").classList.toggle("on", !emboss);
  $("gEmboss").style.display = emboss ? "" : "none";
  $("gPlain").style.display = emboss ? "none" : "";
}
const bind = id => $(id).addEventListener("input", () => {
  S[id] = parseFloat($(id).value);
  $("v" + id[0].toUpperCase() + id.slice(1)).textContent =
    DEC.includes(id) ? S[id].toFixed(2) : S[id];
  $("presetSel").value = "custom";
  draw();
  schedulePreview();
});

function drawContent(g, fg){
  g.globalAlpha = 1; g.fillStyle = fg;
  g.font = "500 34px 'Microsoft YaHei'";
  g.fillText("第 二 部 分 · 营 造 技 艺", 70, 110);
  g.font = "18px 'Microsoft YaHei'";
  g.globalAlpha = 0.75;
  ["斗拱是中国古建筑中特有的结构构件，", "由方形的木块（斗）和弓形的曲木（拱）",
   "层层交错叠加而成，承担着承上启下、", "传递荷载的重要作用。"
  ].forEach((t, i) => g.fillText(t, 70, 180 + i * 34));
  g.globalAlpha = 0.35;
  g.fillRect(640, 140, 250, 300);
}

function draw(){
  const cv = $("cv"), g = cv.getContext("2d");
  const [bg, fg] = BG[S.bg] || BG.light;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.fillStyle = bg; g.fillRect(0, 0, cv.width, cv.height);
  drawContent(g, fg);

  g.font = `${S.fs}px "Microsoft YaHei"`;
  const stepX = g.measureText(S.text).width + S.gx,
        stepY = S.fs * 1.35 + S.gy;
  g.save();
  g.translate(cv.width / 2, cv.height / 2);
  g.rotate(-S.rot * Math.PI / 180);
  g.textBaseline = "middle"; g.lineJoin = "round";
  const R = Math.hypot(cv.width, cv.height);
  for(let y = -R; y <= R; y += stepY){
    for(let x = -R; x <= R; x += stepX){
      if(S.emboss){
        g.strokeStyle = `rgba(${S.dc},${S.dc},${S.dc},${S.da})`;
        g.lineWidth = Math.max(1, S.fs / S.sd);
        g.strokeText(S.text, x, y);
        g.fillStyle = `rgba(255,255,255,${S.la})`;
        g.fillText(S.text, x, y);
      } else {
        g.fillStyle = `rgba(${S.gr},${S.gr},${S.gr},${S.al})`;
        g.fillText(S.text, x, y);
      }
    }
  }
  g.restore();
}

$("text").addEventListener("input", e => { S.text = e.target.value; $("presetSel").value = "custom"; draw(); schedulePreview(); });
$("sfx").addEventListener("input",  e => { S.sfx = e.target.value; updateOutHint(); });
$("mEmboss").onclick = () => { setMode(true);  draw(); schedulePreview(); };
$("mPlain").onclick  = () => { setMode(false); draw(); schedulePreview(); };
SLIDERS.forEach(bind);

$("presetSel").onchange = e => {
  const p = findPreset(e.target.value);
  updatePresetBtns();
  if(p) applyPreset(p);
};

$("btnSave").onclick = () => {
  $("saveRow").style.display = "flex";
  $("btnSave").classList.add("on");       // 保存图标点亮，表示命名行是它展开的
  $("saveName").value = ""; $("saveName").focus();
};
$("btnSaveCancel").onclick = () => { closeSaveRow(); };
function closeSaveRow(){ $("saveRow").style.display = "none"; $("btnSave").classList.remove("on"); }
$("btnSaveOk").onclick = () => {
  const nm = $("saveName").value.trim();
  if(!nm) return;
  // 预设只存水印参数：bg 是预览背景，输出命名是独立的输出设置，都不跟着预设走
  const p = Object.assign({}, S); delete p.bg; p.name = nm;
  const idx = custom.findIndex(x => x.name === nm);
  if(idx >= 0) custom[idx] = p; else custom.push(p);
  persist(); refreshSelect("c" + (idx >= 0 ? idx : custom.length - 1));
  if(HAS_API) pywebview.api.save_presets(custom);   // 同时写到 presets.json，便于发给同事
  closeSaveRow();
  log("已保存预设：" + nm);
};
$("btnDel").onclick = () => {
  const v = $("presetSel").value;
  if(v[0] !== "c"){ log("内置预设不可删除"); return; }
  const nm = custom[+v.slice(1)].name;
  custom.splice(+v.slice(1), 1); persist(); refreshSelect("b0");
  if(HAS_API) pywebview.api.save_presets(custom);
  log("已删除预设：" + nm);
};

document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); S.bg = c.dataset.bg; draw();
});

$("go").onclick = () => {
  const sel = FILES.filter(f => f.sel && f.path);
  const list = sel.length ? sel : FILES.filter(f => f.path);
  if(!list.length){ log("列表里没有真实文件，请先选择 PDF"); return; }
  $("go").disabled = true;
  $("barFill").style.width = "0%";
  log(`开始处理 · ${list.length} 个文件` + (sel.length ? "（仅勾选）" : ""));
  const keys = list.map(f => f.path);
  pywebview.api.start(params(), keys, true);
};

/* 后端进度回调（Python 侧 evaluate_js 调用） */
function onProgress(i, n, name){
  $("barFill").style.width = Math.round(i / Math.max(n, 1) * 100) + "%";
  log(`处理中 ${i + 1}/${n} · ${name}`);
}
function onSkip(name){ log("已存在，跳过：" + name); }
function onDone(ok, fail, keys){
  $("barFill").style.width = "100%";
  $("go").disabled = false;
  const done = new Set(keys || []);
  FILES.forEach(f => { if(done.has(f.path)) f.done = true; });
  renderFiles();
  log(`完成 · 成功 ${ok} 个，失败 ${fail} 个`);
}
function log(t){ $("log").textContent = t; }

/* ---------- 主题切换（右上角色点，选择存本机，下次打开还是它） ---------- */
const THEMES = { mcd:"麦当劳", sprite:"雪碧", oreo:"奥利奥", macaron:"马卡龙" };
const KEY_THEME = "wm_theme_v1";
function setTheme(t){
  if(!THEMES[t]) t = "macaron";
  document.documentElement.dataset.theme = t;
  document.querySelectorAll(".dot").forEach(d => d.classList.toggle("on", d.dataset.t === t));
  try { localStorage.setItem(KEY_THEME, t); } catch(e){}
}
document.querySelectorAll(".dot").forEach(d => d.onclick = () => setTheme(d.dataset.t));
(function(){
  let t = "macaron";
  try { t = localStorage.getItem(KEY_THEME) || "macaron"; } catch(e){}
  setTheme(t);
})();

renderFiles();
refreshSelect("b0");
syncUI();
draw();
bindBackend();     // 桌面 exe：后端注入后再绑定（未就绪则由上面的轮询/事件接手）
setTimeout(checkUpdate, 3000);   // 启动 3 秒后查一次新版本（仓库打 tag vX.X.X.X 才有效）
</script>
</body>
